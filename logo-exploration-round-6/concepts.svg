  </style>
  <text x="70" y="76" class="title">Scribix · Double-loop S</text>
  <text x="70" y="112" class="sub">Four equal directions · monochrome · same scale · unchanged wordmark content</text>

  <g transform="translate(70 160)">
    <rect width="710" height="390" rx="18" fill="#fff" stroke="#d9d9d9"/>
    <text x="28" y="42" class="name">A · Twin Trace</text>
